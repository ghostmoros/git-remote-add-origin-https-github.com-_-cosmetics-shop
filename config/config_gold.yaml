# GOLD (XAUUSD) configuration.
# Gold trends strongly and is volatile, so we use a trend strategy with an ADX
# strength filter and a WIDE take-profit to let winners run. The ATR-based stop
# and risk sizing automatically adapt to gold's larger volatility.
#
# First download real gold history on your MT5 machine:
#     python fetch_history.py XAUUSD H1 5000
# then run:
#     python main.py config/config_gold.yaml
#     python compare.py config/config_gold.yaml

data:
  source: csv                       # gold needs REAL data — synthetic won't reflect it
  csv_path: data/XAUUSD_H1.csv
  # fallback for a quick smoke test before you have real data:
  synthetic_bars: 8000
  seed: 7
  start_price: 2000.0

strategy:
  name: trend_pullback              # trend + ADX filter, pullback entry
  params:
    ema_fast: 21
    ema_slow: 50
    adx_period: 14
    adx_min: 20                      # only trade when the trend is strong

backtest:
  initial_balance: 10000
  risk_pct: 0.005                   # 0.5% per trade — gold is volatile, risk less
  atr_period: 14
  sl_atr: 2.0                       # stop = 2.0 x ATR (auto-wide on gold)
  tp_atr: 4.0                       # target = 4.0 x ATR — let trends run (R:R 2:1)
  spread: 0.30                      # typical gold spread in price (~30 cents)

broker:
  symbol: XAUUSD                    # check the exact symbol in your RoboForex terminal
  timeframe: H1
  candles: 500

live:
  dry_run: true
  allow_real: false
  sizing: risk
  lots: 0.01
  poll_seconds: 60
